name: Build unsigned IPA — POWER UP

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Target bundle identifier
        required: false
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        description: Output IPA name
        required: false
        default: POWER_UP
        type: string
      scheme:
        description: Xcode scheme
        required: false
        default: POWER_UP
        type: string

permissions:
  contents: read

jobs:
  build:
    # macos-14 (Sonoma) has better availability than macos-15.
    # Falls back automatically — if capacity fails, re-run the action.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4   # Node.js 20 warning is harmless; v4 is current

      # ── 2. Select Xcode ────────────────────────────────────
      - name: Select Xcode
        run: |
          # Pick the latest Xcode available on the runner
          XCODE=$(ls /Applications | grep -E '^Xcode' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      # ── 3. Locate project / scheme ─────────────────────────
      - name: Locate Xcode project
        id: locate
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"

          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d -print -quit 2>/dev/null || true)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d \
                      -not -path '*/Pods/*' -print -quit 2>/dev/null || true)

          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo "No .xcodeproj or .xcworkspace found." >&2
            exit 1
          fi

          # Resolve scheme
          if [ -n "$INPUT_SCHEME" ]; then
            SCHEME="$INPUT_SCHEME"
          elif [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); \
                            print((d.get("workspace",{}).get("schemes") or [""])[0])')
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" 2>/dev/null \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); \
                            print((d.get("project",{}).get("schemes") or [""])[0])')
          fi

          [ -n "$SCHEME" ] || { echo "No Xcode scheme found." >&2; exit 1; }

          echo "project=$PROJECT"   >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"     >> "$GITHUB_OUTPUT"
          echo "Scheme: $SCHEME"
          echo "Project: $PROJECT"
          echo "Workspace: $WORKSPACE"

      # ── 4. Resolve Swift packages (if any) ─────────────────
      - name: Resolve Swift packages
        continue-on-error: true
        env:
          PROJECT:   ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
          SCHEME:    ${{ steps.locate.outputs.scheme }}
        run: |
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -resolvePackageDependencies \
              -workspace "$WORKSPACE" -scheme "$SCHEME" 2>&1 | tail -20 || true
          elif [ -n "$PROJECT" ]; then
            xcodebuild -resolvePackageDependencies \
              -project "$PROJECT" -scheme "$SCHEME" 2>&1 | tail -20 || true
          fi

      # ── 5. Build unsigned archive ──────────────────────────
      - name: Build unsigned archive
        env:
          PROJECT:   ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
          SCHEME:    ${{ steps.locate.outputs.scheme }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          LOG="$RUNNER_TEMP/xcodebuild.log"

          COMMON_FLAGS=(
            -scheme          "$SCHEME"
            -sdk             iphoneos
            -configuration   Release
            -archivePath     "$ARCHIVE"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"
            COMPILER_INDEX_STORE_ENABLE=NO
            -allowProvisioningUpdates
          )

          if [ -n "$WORKSPACE" ]; then
            xcodebuild archive -workspace "$WORKSPACE" "${COMMON_FLAGS[@]}" \
              | tee "$LOG"
          else
            xcodebuild archive -project "$PROJECT" "${COMMON_FLAGS[@]}" \
              | tee "$LOG"
          fi

      # ── 6. Package IPA ─────────────────────────────────────
      - name: Package IPA
        env:
          IPA_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" \
                     -maxdepth 1 -name '*.app' -type d -print -quit)
          [ -n "$APP_PATH" ] || { echo "No .app produced." >&2; exit 1; }

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/${IPA_NAME}.ipa"
          test -s "$RUNNER_TEMP/${IPA_NAME}.ipa"
          echo "IPA size: $(du -sh "$RUNNER_TEMP/${IPA_NAME}.ipa" | cut -f1)"

      # ── 7. Upload IPA ──────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ inputs.project_name }}.ipa
          retention-days: 14

      # ── 8. Upload build log (always) ───────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      # ── 9. Summary ─────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          {
            echo "### POWER UP — IPA Build"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Project | ${{ inputs.project_name }} |"
            echo "| Bundle ID | ${{ inputs.bundle_id }} |"
            echo "| Scheme | ${{ inputs.scheme }} |"
            echo "| Signing | disabled (unsigned) |"
            echo "| Runner | macos-14 |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 10. Cleanup ────────────────────────────────────────
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/App.xcarchive"
